<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apology</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff6f61;
            font-size: 36px;
        }
        p {
            font-size: 20px;
            color: #333;
            margin-top: 20px;
        }
        .emoji {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 I am sorry, Sri 💖</h1>
        <p class="emoji">😔🙏</p>
        <p>"In your eyes, I find my peace,
            In your smile, my joys never cease.
            I'm sorry for the pain I've caused,
            For every tear, I feel so lost." 💫</p>
    </div>
</body>
</html>
